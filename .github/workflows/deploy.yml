name: Build and deploy

# Every push to main builds the Docker image, publishes it to GitHub Container Registry,
# then replaces the running container on your Linux server over SSH.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}
  CONTAINER: tickwell

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image name
        id: ref
        run: |
          base=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          echo "image=$base:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "latest=$base:latest" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3 # emulates arm64 so the image can be built on the x86 runner

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.SITE_URL || 'http://localhost:3000' }}
          tags: |
            ${{ steps.ref.outputs.image }}
            ${{ steps.ref.outputs.latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${{ secrets.SSH_PORT || 22 }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Pull and restart the container
        env:
          IMAGE_REF: ${{ needs.build.outputs.image }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOST_PORT: ${{ vars.HOST_PORT || '3000' }}
        run: |
          ssh -i ~/.ssh/id_deploy -p "${{ secrets.SSH_PORT || 22 }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "IMAGE_REF='$IMAGE_REF' REGISTRY_USER='$REGISTRY_USER' REGISTRY_TOKEN='$REGISTRY_TOKEN' HOST_PORT='$HOST_PORT' CONTAINER='${{ env.CONTAINER }}' bash -s" <<'REMOTE'
          set -euo pipefail
          echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
          docker pull "$IMAGE_REF"
          docker rm -f "$CONTAINER" 2>/dev/null || true
          docker run -d \
            --name "$CONTAINER" \
            --restart unless-stopped \
            -p "$HOST_PORT:3000" \
            "$IMAGE_REF"
          docker logout ghcr.io
          docker image prune -f
          REMOTE

      - name: Check the app answers
        run: |
          for i in 1 2 3 4 5 6; do
            if ssh -i ~/.ssh/id_deploy -p "${{ secrets.SSH_PORT || 22 }}" \
              "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
              "curl -fsS http://127.0.0.1:${{ vars.HOST_PORT || '3000' }}/manifest.webmanifest >/dev/null"; then
              echo "App is up"; exit 0
            fi
            sleep 5
          done
          echo "App did not respond"; exit 1
